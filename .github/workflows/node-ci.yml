name: Node CI

on:
  push:
    branches: [main]

jobs:
  build:
    name: Building and testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
